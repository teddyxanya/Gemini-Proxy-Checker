[Proxy Group]

# 0.1 Группа проверенных узлов для Gemini Web (gemini.google.com без региональной заглушки)
GEMINI2 = fallback,policy-regex-filter=^(🇳🇱 Netherlands VB Vless|🇳🇱 Netherlands VB XH Vless|🇳🇱 Netherlands VB SS|🇳🇱 Netherlands VB Trojan|🇺🇸 USA NYU Vless|🇺🇸 USA NYU XH Vless|🇺🇸 USA NYU SS|🇺🇸 USA NYU Trojan)$,interval=540,tolerance=50,url=https://gemini.google.com/favicon.ico,timeout=3
# 0. Группа проверенных узлов для Gemini
GEMINI = fallback,policy-regex-filter=^(🇩🇪 Germany HET Vless|🇩🇪 Germany HET XH Vless|🇩🇪 Germany HET SS|🇩🇪 Germany HET Trojan|🇳🇱 Netherlands VB Vless|🇳🇱 Netherlands VB XH Vless|🇳🇱 Netherlands VB SS|🇳🇱 Netherlands VB Trojan|🇺🇸 USA NYU Vless|🇺🇸 USA NYU XH Vless|🇺🇸 USA NYU SS|🇺🇸 USA NYU Trojan)$,interval=180,tolerance=50,url=https://gemini.google.com/favicon.ico,timeout=3
# 1. Ручной выбор узла без WL и SS
MANUAL-PROXY = select,policy-regex-filter=(?i)^(?!.*\bWL\b)(?!.*\bSS\b).*$
# 2. Авто-скорость: быстрый узел вне RU/BY/UA (убран жесткий дефолт)
AUTO-SPEED = url-test,interval=540,tolerance=100,url=https://abs.twimg.com/favicon.ico,timeout=7,policy-regex-filter=(?i)^(?!.*(?:Russia|Belarus|Ukraine))(?!.*\bWL\b).*\b(?:VLESS|TT|Naive|NV|MR|AWG(?:2|3\.1)?)\b.*$
# 3. Авто-стабильность: первый живой узелhttps://gemini.google.com/favicon.ico
AUTO-STABILITY = fallback,policy-regex-filter=(?i)^(?!.*(?:Russia|Belarus|Ukraine))(?!.*\bWL\b).*\b(?:VLESS|TT|Naive|NV|MR|AWG(?:2|3\.1)?)\b.*$,interval=720,url=https://abs.twimg.com/favicon.ico,timeout=3
# 4. Отдельная группа WL
WL = select,policy-regex-filter=(?i)\bWL\b
# 5. Главный переключатель (теперь сохраняет ваш выбор между мануалом и автоматом)
PROXY = select,AUTO-STABILITY,AUTO-SPEED,MANUAL-PROXY,WL,GEMINI,GEMINI2

